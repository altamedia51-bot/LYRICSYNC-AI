<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="note" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="20" y="20" width="472" height="472" rx="128" fill="url(#bg)" filter="url(#shadow)" />
  <rect x="20" y="20" width="472" height="472" rx="128" stroke="rgba(255, 255, 255, 0.22)" stroke-width="8" />

  <!-- Waveform Equalizer Bars (Left) -->
  <rect x="90" y="250" width="24" height="60" rx="12" fill="rgba(255, 255, 255, 0.45)" />
  <rect x="126" y="200" width="24" height="135" rx="12" fill="rgba(255, 255, 255, 0.75)" />
  <rect x="162" y="160" width="24" height="195" rx="12" fill="rgba(255, 255, 255, 0.95)" />

  <!-- Double Musical Note with Connected Beam (Lyric / Song) -->
  <!-- Stem 1 -->
  <rect x="236" y="145" width="26" height="185" rx="13" fill="url(#note)" />
  <!-- Note Head 1 -->
  <circle cx="218" cy="330" r="38" fill="url(#note)" />

  <!-- Beam connecting Stem 1 and Stem 2 -->
  <path d="M236 145 L368 115 L368 155 L236 185 Z" fill="url(#note)" />

  <!-- Stem 2 -->
  <rect x="342" y="125" width="26" height="175" rx="13" fill="url(#note)" />
  <!-- Note Head 2 -->
  <circle cx="324" cy="300" r="38" fill="url(#note)" />

  <!-- AI Sparkle / Sync Star -->
  <path d="M400 190 C400 215 415 230 440 230 C415 230 400 245 400 270 C400 245 385 230 360 230 C385 230 400 215 400 190 Z" fill="#FACC15" />
  <circle cx="430" cy="180" r="6" fill="#FDE047" />
</svg>
